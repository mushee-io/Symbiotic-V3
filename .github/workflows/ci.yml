name: Symbiotic V3 — Amadeus native
on: [push, pull_request]

jobs:
  amadeus-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject old-chain source references
        shell: bash
        run: |
          # Bracket patterns intentionally avoid matching this guard itself.
          if git grep -n -i -E 'car[d]ano|pre[p]rod|aik[e]n|plut[u]s|blockfro[s]t|cip[-]30' -- .; then
            echo 'Legacy chain implementation or branding detected.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Test portable native RISC-V AMM mathematics (Rust no_std host tests)
        run: cargo test --manifest-path contracts/amadeus-riscv/math/Cargo.toml --offline
      - name: Test native pool host ABI helpers (Rust no_std host tests)
        run: cargo test --manifest-path contracts/amadeus-riscv/pools/Cargo.toml --lib --offline
      - run: npm run build
      - name: Live Amadeus testnet RPC smoke test (nonblocking)
        # A public testnet outage should not mask successful deterministic tests.
        # Check the step OUTCOME separately before declaring M2 network-verified.
        continue-on-error: true
        timeout-minutes: 2
        run: npm run testnet:check

      - name: Read-only native test token registry smoke check (nonblocking)
        # This confirms existing public state only, NEVER that a mint occurred.
        continue-on-error: true
        timeout-minutes: 2
        run: npm run tokens:check

  m11-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert native testnet release guards (static source only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node scripts/check-m11-security.mjs > artifacts/m11-security-source-evidence.json
          node -e 'const f=require("./artifacts/m11-security-source-evidence.json"); if(f.productionReleaseAuthorized!==false || f.liveSwapReceiptsVerified!==false || f.externalSecurityAuditCompleted!==false) process.exit(1)'
      - name: Upload static security gate report (NOT VM or external audit)
        uses: actions/upload-artifact@v4
        with:
          name: m11-static-security-evidence
          path: artifacts/m11-security-source-evidence.json
          retention-days: 30

  riscv-elf:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly Rust with native source toolchain
        run: rustup toolchain install nightly --profile minimal --component rust-src
      - name: Build and verify both native pair-specific ELF guests
        shell: bash
        run: |
          set -euo pipefail
          cd contracts/amadeus-riscv/pools
          export RUSTFLAGS="-C panic=abort"
          TARGET="$PWD/riscv64im-zba-zbb-none.json"
          mkdir -p artifacts
          for pair in testbtc testusd; do
            cargo +nightly build --release --example pool --features "$pair" --target "$TARGET" \
              -Z build-std=core -Z json-target-spec
            cp target/riscv64im-zba-zbb-none/release/examples/pool "artifacts/$pair-ama.elf"
            test "$(head -c 4 "artifacts/$pair-ama.elf" | od -An -tx1 | tr -d ' \n')" = "7f454c46"
            readelf -h "artifacts/$pair-ama.elf" | grep -E 'Machine:.*RISC-V'
            test "$(stat -c %s "artifacts/$pair-ama.elf")" -le 524288
            sha256sum "artifacts/$pair-ama.elf"
          done
          test "$(sha256sum artifacts/testbtc-ama.elf | awk '{print $1}')" != \
               "$(sha256sum artifacts/testusd-ama.elf | awk '{print $1}')"
          (cd artifacts && sha256sum *.elf > SHA256SUMS)
      - name: Upload unsigned build artifacts and checksums (never deployed)
        uses: actions/upload-artifact@v4
        with:
          name: amadeus-m6-riscv-pool-elf
          path: contracts/amadeus-riscv/pools/artifacts/
          retention-days: 30


  m12-demo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate reproducible public-demo source evidence (not chain or deployment evidence)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node scripts/check-m12-evidence.mjs > artifacts/m12-public-demo-source-evidence.json
          node -e 'const e=require("./artifacts/m12-public-demo-source-evidence.json"); if(e.tradingEnabled!==false || e.productionSigningEnabled!==false || e.fourRealSwapReceiptsVerified!==false || e.publicVercelDeploymentIndependentlyVerified!==false || e.grantAwardConfirmed!==false || e.externalSecurityAuditCompleted!==false)process.exit(1)'
          sha256sum artifacts/m12-public-demo-source-evidence.json > artifacts/m12-public-demo-source-evidence.sha256
      - name: Upload source manifest, SHA-256 checksum and public documentation
        uses: actions/upload-artifact@v4
        with:
          name: m12-public-demo-evidence
          path: |
            artifacts/m12-public-demo-source-evidence.json
            artifacts/m12-public-demo-source-evidence.sha256
            docs/m12-public-testnet-demo.md
            docs/m12-amadeus-ecosystem-proposal.md
          retention-days: 30
