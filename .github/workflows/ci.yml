name: Symbiotic V3 — Amadeus native
on: [push, pull_request]

jobs:
  amadeus-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject old-chain source references
        shell: bash
        run: |
          # Bracket patterns intentionally avoid matching this guard itself.
          if git grep -n -i -E 'car[d]ano|pre[p]rod|aik[e]n|plut[u]s|blockfro[s]t|cip[-]30' -- .; then
            echo 'Legacy chain implementation or branding detected.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Test portable native RISC-V AMM mathematics (Rust no_std host tests)
        run: cargo test --manifest-path contracts/amadeus-riscv/math/Cargo.toml --offline
      - run: npm run build
      - name: Live Amadeus testnet RPC smoke test (nonblocking)
        # A public testnet outage should not mask successful deterministic tests.
        # Check the step OUTCOME separately before declaring M2 network-verified.
        continue-on-error: true
        timeout-minutes: 2
        run: npm run testnet:check

      - name: Read-only native test token registry smoke check (nonblocking)
        # This confirms existing public state only, NEVER that a mint occurred.
        continue-on-error: true
        timeout-minutes: 2
        run: npm run tokens:check
